prefill:
  model: zai-org/GLM-5.3
  args:
    device-ids: 0,1,2,3,4,5,6,7
    port: 8000
    tensor-parallel-size: 8
    enable-expert-parallel: true
    kv-transfer-config:
      kv_connector: MultiConnector
      kv_role: kv_both
      kv_connector_extra_config:
        enforce_handshake_compat: false
        num_threads: 1
        connectors:
        - kv_connector: NixlConnector
          kv_role: kv_producer
          kv_load_failure_policy: fail
          kv_connector_extra_config:
            enforce_handshake_compat: false
            num_threads: 1
        - kv_connector: OffloadingConnector
          kv_role: kv_both
          kv_connector_extra_config:
            spec_name: TieringOffloadingSpec
            cpu_bytes_to_use: 549755813888
            eviction_policy: lru
      kv_load_failure_policy: fail
      engine_id: zhu-glm53-h200-e85fix-v2-tp8-tp8-mtp3-offload512-prefill
    served-model-name: zhu-glm53-h200-e85fix-v2-tp8-tp8-mtp3-offload512
    disable-access-log-for-endpoints: /health,/v1/models,/metrics
    trust-remote-code: true
    kv-cache-dtype: fp8_ds_mla
    moe-backend: deep_gemm
    safetensors-load-strategy: prefetch
    seed: 0
    disable-uvicorn-access-log: true
    all2all-backend: deepep_high_throughput
    revision: 30333038ada1f1dacb294a93270305a890b50c14
    tokenizer-revision: 30333038ada1f1dacb294a93270305a890b50c14
    enable-auto-tool-choice: true
    tool-call-parser: glm47
    reasoning-parser: glm45
    speculative-config:
      method: mtp
      num_speculative_tokens: 3
    max-model-len: 142000
    gpu-memory-utilization: 0.85
    max-num-batched-tokens: 16384
    max-num-seqs: 256
    enable-prefix-caching: true
    compilation-config:
      cudagraph_mode: NONE
    kernel-config:
      enable_flashinfer_autotune: false
      linear_backend: deep_gemm
    attention-config:
      sparse_mla_force_mqa: true
